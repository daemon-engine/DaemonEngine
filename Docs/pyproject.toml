# Python tooling for the documentation site only; the engine itself builds with MSBuild.
[project]
name = "daemon-engine-docs"
version = "0"
requires-python = ">=3.13"
dependencies = [
  "breathe>=5.1,<6",
  "exhale>=0.3.7,<0.4",
  "furo>=2025.12.19",
  "myst-parser>=5.2,<6",
  "sphinx>=9.1,<10",
]

[tool.uv]
package = false
